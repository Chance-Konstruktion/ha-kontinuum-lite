evaluate:
  name: Evaluate
  description: >-
    Run one engine tick and, if the current surprise crosses the anomaly
    threshold, fire a `kontinuum_lite_anomaly` event on the bus.
  fields:
    payload:
      name: Payload
      description: >-
        Observation forwarded to the engine. For learning it needs at least
        entity_id and new_state for an entity the engine already tracks;
        normal operation feeds observations automatically from the configured
        entities, so this service is mainly for testing/manual feeding.
      required: false
      example: '{"entity_id": "binary_sensor.flur_bewegung", "new_state": "on", "old_state": "off"}'
      selector:
        object:

save_brain:
  name: Save brain
  description: >-
    Force an immediate snapshot of the learned brain to disk. Useful before a
    planned restart; otherwise the brain is saved periodically and on shutdown.

reset_brain:
  name: Reset brain
  description: >-
    Erase all learning (hippocampus, predictive, cerebellum, basal ganglia and
    the metaplasticity meta-state) and reload cold. This cannot be undone.

set_mode:
  name: Set operation mode
  description: >-
    Switch the operation mode: shadow (only observe), confirm (ask before every
    action) or active (act autonomously).
  fields:
    mode:
      name: Mode
      description: The operation mode to switch to.
      required: true
      example: confirm
      selector:
        select:
          options:
            - shadow
            - confirm
            - active

confirm_action:
  name: Confirm action
  description: >-
    Confirm a pending action (confirm mode). Provide the confirm_id from the
    notification, or set confirm_all to run every pending action.
  fields:
    confirm_id:
      name: Confirm ID
      description: The id of the pending action to confirm.
      required: false
      example: c_1721740000_42
      selector:
        text:
    confirm_all:
      name: Confirm all
      description: Confirm every pending action instead of a single one.
      required: false
      default: false
      selector:
        boolean:

reject_action:
  name: Reject action
  description: >-
    Reject a pending action (confirm mode). Feeds negative reinforcement back
    into the basal ganglia and amygdala so the engine learns from the rejection.
  fields:
    confirm_id:
      name: Confirm ID
      description: The id of the pending action to reject.
      required: true
      example: c_1721740000_42
      selector:
        text:

evaluate:
  name: Evaluate
  description: >-
    Run one engine tick and, if the current surprise crosses the anomaly
    threshold, fire a `kontinuum_lite_anomaly` event on the bus.
  fields:
    payload:
      name: Payload
      description: >-
        Observation forwarded to the engine. For learning it needs at least
        entity_id and new_state for an entity the engine already tracks;
        normal operation feeds observations automatically from the configured
        entities, so this service is mainly for testing/manual feeding.
      required: false
      example: '{"entity_id": "binary_sensor.flur_bewegung", "new_state": "on", "old_state": "off"}'
      selector:
        object:
